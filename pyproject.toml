[project]
name = "attention-span"
version = "1.0.0"
description = "A Claude Code status line that tracks your model's attention span, not its context window."
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Stdlib-only on purpose: this runs inside the user's Claude Code process.
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.6.1",
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.15",
]

[tool.uv]
# Releases are plain tarballs from scripts/build_release.py, not a built package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
relative_files = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 87
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "I", "PIE", "RUF100", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "attention_span",
  "launcher.py",
  "scripts",
  "statusline.py",
  "tests/bands.py",
  "tests/builders.py",
  "update.py",
]
exclude = ["^\\.venv/", "^tests/test_.*\\.py$"]
